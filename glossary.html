<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glosario · Grecia — 30 Entregas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Playfair+Display:wght@600;700;800&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        aegean: { 950:'#0a2a3f', 900:'#0F3854', 800:'#144a6c' },
        ionian: { 600:'#1D8A99', 400:'#4AB0B8', 300:'#7ecdd3' },
        marble: { 50:'#F9F8F6', 100:'#f3f1ec', 200:'#e9e4d9' },
        terracotta: { DEFAULT:'#E07A5F', dark:'#c15f45' },
        gold: { 500:'#D4AF37', 600:'#b7952b' },
      },
      fontFamily: {
        serif: ['Cormorant Garamond','Playfair Display','Georgia','serif'],
        display: ['Playfair Display','Georgia','serif'],
        sans: ['Jost','Inter','system-ui','sans-serif'],
      }
    }}
  }
</script>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body class="font-sans">

<header class="sticky top-0 z-50 glass">
  <div class="max-w-7xl mx-auto px-5 md:px-8 py-3 flex items-center justify-between gap-4">
    <a href="index.html" class="flex items-center gap-2.5 shrink-0">
      <i data-lucide="anchor" class="w-6 h-6 text-terracotta"></i>
      <span class="font-display font-bold text-aegean-900 text-lg" data-i18n="site_name">Grecia · Plan de Formación</span>
    </a>
    <div class="flex items-center gap-3">
      <a href="index.html" class="hidden sm:flex items-center gap-1.5 text-sm font-medium text-aegean-900 hover:text-terracotta transition">
        <i data-lucide="home" class="w-4 h-4"></i>
        <span data-i18n="back_home">Volver al inicio</span>
      </a>
      <div class="lang-toggle">
        <button data-lang="es">ES</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </div>
</header>

<section class="max-w-5xl mx-auto px-5 md:px-8 pt-14 pb-6 text-center">
  <i data-lucide="library" class="w-8 h-8 text-terracotta mx-auto mb-4"></i>
  <h1 class="font-display font-extrabold text-aegean-900 text-3xl md:text-4xl mb-3" data-i18n="glossary_title">Glosario y conceptos</h1>
  <p class="font-serif text-ink-600 text-lg max-w-xl mx-auto" data-i18n="glossary_sub">Filtra las 30 entregas por los conceptos sociológicos e históricos que las atraviesan.</p>
</section>

<main class="max-w-5xl mx-auto px-5 md:px-8 pb-20">
  <div class="relative mb-8">
    <i data-lucide="search" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-aegean-800/50"></i>
    <input id="glossary-search" type="text" data-i18n-ph="nav_search_ph"
      class="w-full pl-11 pr-4 py-3 rounded-full glass text-aegean-900 placeholder:text-aegean-800/40 focus:outline-none focus:ring-2 focus:ring-ionian-400"
      placeholder="Buscar concepto…">
  </div>
  <div id="term-cloud" class="flex flex-wrap gap-2.5"></div>
</main>

<footer class="border-t border-gold-500/20 bg-aegean-900 text-marble-100/70">
  <div class="max-w-7xl mx-auto px-5 md:px-8 py-8 text-center text-sm" data-i18n="footer_note">
    Plan de formación privado — CliO Consulting · 2026
  </div>
</footer>

<script src="assets/js/content.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/utils.js"></script>
<script>
  const CONTENT = window.SITE_CONTENT;
  function renderCloud(filterQ = "") {
    const lang = I18N.lang;
    const q = filterQ.trim().toLowerCase();
    const items = CONTENT.glossary
      .filter(g => !q || g[lang].toLowerCase().includes(q) || g.es.toLowerCase().includes(q))
      .sort((a,b) => b.entregas.length - a.entregas.length || a[lang].localeCompare(b[lang]));
    document.getElementById("term-cloud").innerHTML = items.map(g => `
      <a href="index.html?term=${encodeURIComponent(g.es)}" class="term-pill" style="font-size:${0.72 + Math.min(g.entregas.length,6)*0.045}rem">
        ${esc(g[lang])}
        <span class="opacity-50">(${g.entregas.length})</span>
      </a>
    `).join("");
  }
  document.getElementById("glossary-search").addEventListener("input", e => renderCloud(e.target.value));
  I18N.init(() => renderCloud(document.getElementById("glossary-search").value));
  renderCloud();
  renderIcons();
</script>
</body>
</html>
